# Busca llaves, contraseñas y tokens en TODO el historial del repositorio, no solo en la
# versión actual. Un secreto que se subió y luego se borró sigue en el historial.
# Si aparece algo, hay que revocarlo en el servicio (Firebase, Brevo) aunque ya no esté.
name: Secretos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks sobre todo el historial
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
