# Despliegue completo con HTTPS. Ver docs/seguridad/despliegue.md
#   cp .env.docker.example .env.docker   y llena los valores
#   docker compose --env-file .env.docker up -d --build
# Solo Caddy publica puertos. La base no es accesible desde fuera y la API solo desde Caddy.
#
# Demostración por internet sin abrir puertos, con un túnel de Cloudflare
#   docker compose --env-file .env.docker --profile tunel up -d --build
# Sin dominio, con el túnel rápido (dirección temporal en trycloudflare.com)
#   docker compose --env-file .env.docker --profile tunel-rapido up -d --build
# El túnel sale desde el contenedor hacia Cloudflare (sin puertos de entrada) y entrega el
# tráfico a la API por la red interna. Cloudflare pone el certificado HTTPS público.
#
# Monitoreo con Prometheus y Grafana (ver docs/seguridad/monitoreo.md). Prometheus lee las
# métricas de la API por la red de monitoreo y Grafana queda en http://127.0.0.1:3001, solo
# desde el mismo servidor (por un túnel SSH desde otra computadora).

name: familiasquesuman

# Los logs llevan IPs, que pueden ser datos personales. Se rotan para no guardarlos de
# forma indefinida (5 archivos de 10 MB por servicio)
x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  db:
    <<: *logs
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: familiasquesuman
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      FQS_API_PASSWORD: ${FQS_API_PASSWORD:?Define FQS_API_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/fqs-db:ro
      - ./docker/initdb.sh:/docker-entrypoint-initdb.d/00_fqs.sh:ro
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d familiasquesuman"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]

  api:
    <<: *logs
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENTORNO: production
      HOST: 0.0.0.0
      PORT: 3000
      # La contraseña va aparte en PGPASSWORD (libpq la lee sola). Dentro de la URL, una contraseña
      # con / + o = (como las que da generar_clave) rompería la dirección
      DATABASE_URL: postgresql://fqs_api@db:5432/familiasquesuman
      PGPASSWORD: ${FQS_API_PASSWORD}
      # La base solo se alcanza dentro de la red interna de Docker, sin puerto publicado
      DB_SSL: disable
      DB_RED_AISLADA: "1"
      TRUST_PROXY: 1
      UPLOAD_DIR: /app/uploads
      ADMIN_2FA: obligatorio
      CLAVE_CIFRADO_2FA: ${CLAVE_CIFRADO_2FA:?Define CLAVE_CIFRADO_2FA}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-}
      ALERTAS_CORREO: ${ALERTAS_CORREO:-}
      SMS: ${SMS:-desactivado}
      FCM_CUENTA_SERVICIO: /run/secrets/firebase
      LOG_LEVEL: info
      # Las métricas solo escuchan en la dirección de la API dentro de la red de monitoreo,
      # así Caddy y el túnel no pueden alcanzarlas aunque compartan otra red con la API
      METRICAS_HOST: 172.31.250.10
      METRICAS_PUERTO: 9464
    secrets: [firebase]
    volumes:
      - uploads:/app/uploads
    networks:
      interna: {}
      salida: {}
      monitoreo:
        ipv4_address: 172.31.250.10
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    <<: *logs
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    environment:
      FQS_DOMINIO: ${FQS_DOMINIO:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [salida]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

  # Túnel de Cloudflare para la demostración por internet. Solo arranca con --profile tunel.
  # El token se crea en el panel de Cloudflare (Zero Trust, Networks, Tunnels) y el nombre
  # público del túnel se apunta a http://api:3000
  tunel:
    <<: *logs
    profiles: [tunel]
    image: cloudflare/cloudflared:2026.10.1
    restart: unless-stopped
    depends_on: [api]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [salida]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Guarda las métricas de la API 15 días y evalúa las reglas de alerta. Sin puertos publicados
  prometheus:
    <<: *logs
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    depends_on: [api]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=:9090
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoreo]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Tableros. Solo se publica en 127.0.0.1, la contraseña de administración sale de .env.docker
  grafana:
    <<: *logs
    image: grafana/grafana:12.4.11
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: 30m
      GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: 12h
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SNAPSHOTS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_LOG_MODE: console
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/tableros:/etc/grafana/tableros:ro
      - grafana_data:/var/lib/grafana
    networks: [monitoreo, grafana_local]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Túnel rápido de Cloudflare, sin cuenta ni dominio. Solo arranca con --profile tunel-rapido.
  # La dirección https://algo.trycloudflare.com sale en
  #   docker compose --env-file .env.docker logs tunel-rapido
  # y cambia cada vez que se reinicia este servicio. No transmite Server-Sent Events, así que
  # los cupos en vivo no se actualizan solos (se ven al recargar). Para una dirección fija y
  # cupos en vivo se usa el perfil tunel con un dominio en Cloudflare.
  tunel-rapido:
    <<: *logs
    profiles: [tunel-rapido]
    image: cloudflare/cloudflared:2026.10.1
    restart: unless-stopped
    depends_on: [api]
    command: tunnel --no-autoupdate --url http://api:3000
    networks: [salida]
    read_only: true
    tmpfs: [/tmp, /home/nonroot/.cloudflared]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Respaldo cifrado bajo demanda
  #   docker compose --env-file .env.docker --profile respaldo run --rm respaldo
  respaldo:
    <<: *logs
    profiles: [respaldo]
    build:
      context: .
      target: respaldo
    depends_on:
      db:
        condition: service_healthy
    environment:
      RESPALDO_DATABASE_URL: postgresql://postgres@db:5432/familiasquesuman
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RESPALDO_CLAVE: ${RESPALDO_CLAVE:?Define RESPALDO_CLAVE}
      RESPALDO_DIR: /respaldos
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads:ro
      - ./respaldos:/respaldos
    networks: [interna]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  # Sin salida a internet, solo la base, la API y el respaldo
  interna:
    internal: true
  # La API necesita salir para Firebase y Brevo, Caddy para recibir y para los certificados
  salida: {}
  # Sin salida a internet, solo la API, Prometheus y Grafana. La dirección fija de la API
  # permite que las métricas escuchen solo aquí. Si el rango choca con otra red del servidor
  # se cambia el rango y METRICAS_HOST juntos
  monitoreo:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/24
  # Docker solo publica puertos de redes con salida, esta red existe para publicar Grafana
  # en 127.0.0.1
  grafana_local: {}

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

secrets:
  firebase:
    file: ./docker/secretos/firebase-cuenta-servicio.json
