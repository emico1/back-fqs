# Prometheus para la API de Familias que Suman. Ver docs/seguridad/monitoreo.md
# Corre dentro de la red de monitoreo, sin puertos publicados. Grafana lo consulta por esa red.

global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    sistema: familiasquesuman

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # Métricas de la API. El puerto 9464 solo escucha en la red de monitoreo, Caddy y el túnel
  # nunca lo exponen
  - job_name: fqs-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["api:9464"]
        labels:
          servicio: api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
